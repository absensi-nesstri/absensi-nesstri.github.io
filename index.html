    /* ------------------------------------------------------------------------
       VIEW 3: HASIL (RINGKASAN, PERINGKAT, ANALISIS SOAL, DETAIL SISWA, CSV)
       ------------------------------------------------------------------------ */
    function renderHasil(container) {
      const exam = getActiveExam();
      if (!exam) {
        container.innerHTML = `
          <div class="bento-card" style="text-align:center;padding:36px 20px;">
            <div style="font-size:40px;margin-bottom:10px;">📊</div>
            <h2 style="font-size:20px;font-weight:800;margin-bottom:8px;">Belum Ada Data Hasil</h2>
            <p style="font-size:14px;color:var(--text-muted);max-width:340px;margin:0 auto 20px;">
              Silakan buat ujian di menu Pengaturan lalu pindai lembar jawab siswa.
            </p>
            <button id="btnResToSettings" class="btn btn-primary">Buka Pengaturan</button>
          </div>
        `;
        document.getElementById('btnResToSettings').addEventListener('click', () => navigateTo('pengaturan'));
        return;
      }

      const students = exam.students;
      const count = students.length;
      const scores = students.map(s => s.score);
      const avg = count ? Math.round((scores.reduce((a, b) => a + b, 0) / count) * 10) / 10 : 0;
      const highest = count ? Math.max(...scores) : 0;
      const lowest = count ? Math.min(...scores) : 0;

      // 5 Kelompok Sebaran Nilai (<60, 60-69, 70-79, 80-89, 90-100)
      const buckets = [
        { label: '<60', count: scores.filter(v => v < 60).length },
        { label: '60-69', count: scores.filter(v => v >= 60 && v < 70).length },
        { label: '70-79', count: scores.filter(v => v >= 70 && v < 80).length },
        { label: '80-89', count: scores.filter(v => v >= 80 && v < 90).length },
        { label: '90-100', count: scores.filter(v => v >= 90).length }
      ];
      const maxBucket = Math.max(1, ...buckets.map(b => b.count));

      // Analisis butir soal
      const itemStats = Array.from({ length: exam.jumlahSoal }, (_, q) => {
        const k = exam.key[q] || '';
        const rightCount = students.filter(s => s.answers[q] === k && k !== '').length;
        const pct = count ? Math.round((rightCount / count) * 100) : 0;
        let cat = 'Sulit';
        if (pct >= 70) cat = 'Mudah';
        else if (pct >= 40) cat = 'Sedang';
        return { nomor: q + 1, kunci: k || '-', rightCount, pct, cat };
      });

      const mudahCnt = itemStats.filter(i => i.cat === 'Mudah').length;
      const sedangCnt = itemStats.filter(i => i.cat === 'Sedang').length;
      const sulitCnt = itemStats.filter(i => i.cat === 'Sulit').length;

      const sortedRank = [...students].sort((a, b) => b.score - a.score || b.benar - a.benar);
      const sortedDetail = [...students].sort((a, b) => {
        if (uiState.detailSort === 'nilai') return b.score - a.score;
        if (uiState.detailSort === 'nama') return a.nama.localeCompare(b.nama);
        return (b.createdAt || 0) - (a.createdAt || 0);
      });

      container.innerHTML = `
        <div class="page-header">
          <div>
            <h2 class="page-title">Hasil &amp; Analisis</h2>
            <div style="font-size:13px;color:var(--text-muted);font-weight:600;">
              ${escapeHtml(exam.jenis)} · ${escapeHtml(exam.mapel)} (${escapeHtml(exam.kelas)})
            </div>
          </div>
          ${count > 0 ? `<button id="btnExportCsv" class="btn btn-hero btn-sm">📥 Ekspor CSV</button>` : ''}
        </div>

        <!-- SUMMARY BENTO ROW -->
        <div class="summary-row" style="margin-bottom:14px;">
          <div class="bento-card bento-hero" style="display:flex;align-items:center;gap:14px;">
            <div class="score-ring" style="--ring-pct:${avg};">
              <div class="score-ring-inner">${avg}</div>
            </div>
            <div>
              <div style="font-size:13px;color:var(--text-hero-muted);font-weight:700;">Rata-rata Kelas</div>
              <div style="font-size:13px;opacity:0.85;margin-top:4px;">Skala 0–100</div>
            </div>
          </div>

          <div class="bento-card bento-pastel-blue">
            <div class="field-label">Siswa</div>
            <div class="big-stat">${count}</div>
          </div>

          <div class="bento-card bento-pastel-green">
            <div class="field-label">Tertinggi</div>
            <div class="big-stat">${highest}</div>
          </div>

          <div class="bento-card bento-pastel-pink">
            <div class="field-label">Terendah</div>
            <div class="big-stat">${lowest}</div>
          </div>
        </div>

        <!-- SEBARAN NILAI -->
        <div class="bento-card" style="margin-bottom:16px;">
          <div style="font-weight:800;font-size:15px;">Sebaran Nilai</div>
          <div class="dist-bars">
            ${buckets.map(b => `
              <div class="dist-col">
                <span style="font-size:12px;font-weight:800;">${b.count}</span>
                <div class="dist-bar" style="height:${Math.round((b.count / maxBucket) * 62) + 6}px;"></div>
                <span style="font-size:11px;color:var(--text-muted);font-weight:700;">${b.label}</span>
              </div>
            `).join('')}
          </div>
        </div>

        <!-- TABS -->
        <div class="sub-tabs" role="tablist">
          <button class="sub-tab ${uiState.resultsTab === 'peringkat' ? 'active' : ''}" data-rtab="peringkat">Peringkat</button>
          <button class="sub-tab ${uiState.resultsTab === 'analisis' ? 'active' : ''}" data-rtab="analisis">Analisis Soal</button>
          <button class="sub-tab ${uiState.resultsTab === 'detail' ? 'active' : ''}" data-rtab="detail">Detail Siswa</button>
        </div>

        ${count === 0 ? `
          <div class="bento-card" style="text-align:center;padding:28px;">
            <p style="color:var(--text-muted);margin-bottom:14px;">Belum ada lembar siswa yang disimpan pada ujian ini.</p>
            <button id="btnGoScanFromRes" class="btn btn-primary">Mulai Pindai Lembar</button>
          </div>
        ` : ''}

        ${count > 0 && uiState.resultsTab === 'peringkat' ? `
          <div class="rank-list">
            ${sortedRank.map((s, idx) => {
              const rankCls = idx === 0 ? 'rank-1' : idx === 1 ? 'rank-2' : idx === 2 ? 'rank-3' : '';
              return `
                <div class="bento-card" style="display:flex;align-items:center;gap:12px;padding:16px;">
                  <div class="rank-badge ${rankCls}">${idx + 1}</div>
                  <div style="flex:1;min-width:0;">
                    <div style="font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                      ${escapeHtml(s.nama)}
                    </div>
                    <div style="font-size:12px;color:var(--text-muted);font-weight:600;">
                      B: ${s.benar} · S: ${s.salah} · K: ${s.kosong}
                    </div>
                    <div style="height:6px;background:var(--bg-card-alt);border-radius:999px;margin-top:6px;overflow:hidden;">
                      <div style="height:100%;width:${s.score}%;background:var(--accent-primary);"></div>
                    </div>
                  </div>
                  <div style="font-size:22px;font-weight:800;color:var(--accent-primary);">${s.score}</div>
                </div>
              `;
            }).join('')}
          </div>
        ` : ''}

        ${count > 0 && uiState.resultsTab === 'analisis' ? `
          <div class="bento-grid">
            <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;">
              <div class="bento-card bento-pastel-green" style="padding:14px;text-align:center;">
                <div style="font-size:12px;font-weight:700;">Mudah (≥70%)</div>
                <div style="font-size:24px;font-weight:800;">${mudahCnt}</div>
              </div>
              <div class="bento-card bento-pastel-yellow" style="padding:14px;text-align:center;">
                <div style="font-size:12px;font-weight:700;">Sedang (40-69%)</div>
                <div style="font-size:24px;font-weight:800;">${sedangCnt}</div>
              </div>
              <div class="bento-card bento-pastel-pink" style="padding:14px;text-align:center;">
                <div style="font-size:12px;font-weight:700;">Sulit (&lt;40%)</div>
                <div style="font-size:24px;font-weight:800;">${sulitCnt}</div>
              </div>
            </div>

            <div class="bento-card">
              <div style="display:grid;gap:8px;">
                ${[...itemStats].sort((a, b) => a.pct - b.pct).map(it => {
                  const badgeCls = it.cat === 'Mudah' ? 'ans-benar' : it.cat === 'Sedang' ? 'ans-ganda' : 'ans-salah';
                  return `
                    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:var(--bg-card-alt);border-radius:14px;">
                      <div>
                        <strong>Soal #${it.nomor}</strong>
                        <span style="font-size:12px;color:var(--text-muted);margin-left:6px;">Kunci: ${it.kunci}</span>
                      </div>
                      <div style="display:flex;align-items:center;gap:8px;">
                        <span style="font-size:13px;font-weight:700;">${it.rightCount}/${count} (${it.pct}%)</span>
                        <span class="ans-pill ${badgeCls}">${it.cat}</span>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          </div>
        ` : ''}

        ${count > 0 && uiState.resultsTab === 'detail' ? `
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
            <span style="font-size:13px;font-weight:700;color:var(--text-muted);">Urutkan:</span>
            <div class="btn-row">
              <button class="btn btn-sm ${uiState.detailSort === 'terbaru' ? 'btn-hero' : 'btn-soft'}" data-dsort="terbaru">Terbaru</button>
              <button class="btn btn-sm ${uiState.detailSort === 'nilai' ? 'btn-hero' : 'btn-soft'}" data-dsort="nilai">Nilai</button>
              <button class="btn btn-sm ${uiState.detailSort === 'nama' ? 'btn-hero' : 'btn-soft'}" data-dsort="nama">Nama</button>
            </div>
          </div>

          <div class="bento-grid desktop-two-col">
            ${sortedDetail.map(s => `
              <div class="bento-card">
                <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;">
                  <input type="text" class="input-box" style="padding:8px 12px;" data-student-rename="${s.id}" value="${escapeHtml(s.nama)}" />
                  <div style="font-size:22px;font-weight:800;color:var(--accent-primary);">${s.score}</div>
                </div>
                <div style="font-size:12px;color:var(--text-muted);font-weight:600;margin-bottom:12px;">
                  Benar: ${s.benar} · Salah: ${s.salah} · Kosong: ${s.kosong}
                </div>
                <div class="btn-row">
                  <button class="btn btn-soft btn-sm" data-edit-saved="${s.id}">Koreksi Manual</button>
                  <button class="btn btn-danger btn-sm" data-del-saved="${s.id}">Hapus</button>
                </div>
              </div>
            `).join('')}
          </div>
        ` : ''}
      `;

      container.querySelectorAll('[data-rtab]').forEach(btn => {
        btn.addEventListener('click', () => {
          uiState.resultsTab = btn.getAttribute('data-rtab');
          renderApp();
        });
      });

      document.getElementById('btnGoScanFromRes')?.addEventListener('click', () => navigateTo('pindai'));

      document.getElementById('btnExportCsv')?.addEventListener('click', () => {
        const rows = [['No', 'Nama Siswa', 'Benar', 'Salah', 'Kosong', 'Nilai']];
        sortedRank.forEach((s, i) => {
          rows.push([i + 1, `"${s.nama.replace(/"/g, '""')}"`, s.benar, s.salah, s.kosong, s.score]);
        });
        const csv = rows.map(r => r.join(',')).join('\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Hasil_${exam.mapel}_${exam.kelas}.csv`.replace(/\s+/g, '_');
        a.click();
        URL.revokeObjectURL(url);
        showToast('Berkas CSV diunduh');
      });

      container.querySelectorAll('[data-dsort]').forEach(btn => {
        btn.addEventListener('click', () => {
          uiState.detailSort = btn.getAttribute('data-dsort');
          renderApp();
        });
      });

      container.querySelectorAll('[data-student-rename]').forEach(inp => {
        inp.addEventListener('change', () => {
          const s = exam.students.find(x => x.id === inp.getAttribute('data-student-rename'));
          if (s && inp.value.trim()) {
            s.nama = inp.value.trim();
            saveState();
            showToast('Nama siswa diperbarui');
          }
        });
      });

      container.querySelectorAll('[data-edit-saved]').forEach(btn => {
        btn.addEventListener('click', () => openManualModal('saved', btn.getAttribute('data-edit-saved')));
      });

      container.querySelectorAll('[data-del-saved]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-del-saved');
          exam.students = exam.students.filter(x => x.id !== id);
          saveState();
          showToast('Data siswa dihapus');
          renderApp();
        });
      });
    }

    /* ------------------------------------------------------------------------
       VIEW 4: RIWAYAT & CADANGAN DATA (JSON EXPORT / RESTORE)
       ------------------------------------------------------------------------ */
    function renderRiwayat(container) {
      const q = uiState.historyQuery.toLowerCase();
      const filteredExams = appState.exams.filter(ex =>
        ex.mapel.toLowerCase().includes(q) ||
        ex.kelas.toLowerCase().includes(q) ||
        ex.jenis.toLowerCase().includes(q)
      );

      // Aktivitas terbaru lintas ujian
      const recentActivities = [];
      appState.exams.forEach(ex => {
        ex.students.forEach(st => {
          recentActivities.push({ exam: ex, student: st });
        });
      });
      recentActivities.sort((a, b) => (b.student.createdAt || 0) - (a.student.createdAt || 0));

      container.innerHTML = `
        <div class="page-header">
          <h2 class="page-title">Riwayat &amp; Cadangan</h2>
        </div>

        <div class="field-group">
          <input id="inpSearchHistory" type="search" class="input-box"
            placeholder="Cari mata pelajaran, kelas, atau jenis ujian…" value="${escapeHtml(uiState.historyQuery)}" />
        </div>

        <div class="bento-grid desktop-two-col" style="margin-bottom:16px;">
          ${filteredExams.length === 0 ? `
            <div class="bento-card">
              <p style="color:var(--text-muted);">Tidak ada ujian yang cocok dengan pencarian.</p>
            </div>
          ` : filteredExams.map(ex => `
            <div class="bento-card ${ex.id === appState.activeExamId ? 'bento-pastel-blue' : ''}">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px;">
                <div>
                  <div style="font-size:12px;font-weight:700;color:var(--text-muted);">${escapeHtml(ex.jenis)}</div>
                  <div style="font-size:17px;font-weight:800;">${escapeHtml(ex.mapel)} · ${escapeHtml(ex.kelas)}</div>
                  <div style="font-size:13px;color:var(--text-muted);margin-top:2px;">
                    ${ex.students.length} lembar dikoreksi · ${ex.jumlahSoal} soal
                  </div>
                </div>
              </div>

              <div class="btn-row">
                <button class="btn btn-hero btn-sm" data-open-exam="${ex.id}">Buka Hasil</button>
                <button class="btn btn-primary btn-sm" data-scan-exam="${ex.id}">Pindai Lagi</button>
                <button class="btn btn-soft btn-sm" data-clone-exam="${ex.id}">Salin Ujian</button>
                <button class="btn btn-danger btn-sm" data-del-exam="${ex.id}">Hapus</button>
              </div>
            </div>
          `).join('')}
        </div>

        <div class="bento-grid desktop-two-col">
          <div class="bento-card">
            <div style="font-weight:800;font-size:16px;margin-bottom:10px;">Aktivitas Terbaru</div>
            ${recentActivities.length === 0 ? `
              <p style="font-size:13px;color:var(--text-muted);">Belum ada lembar yang dikoreksi.</p>
            ` : `
              <div style="display:grid;gap:8px;">
                ${recentActivities.slice(0, 6).map(act => `
                  <button type="button" data-act-exam="${act.exam.id}"
                    style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--bg-card-alt);border-radius:14px;text-align:left;">
                    <div>
                      <div style="font-weight:700;font-size:14px;">${escapeHtml(act.student.nama)}</div>
                      <div style="font-size:12px;color:var(--text-muted);">${escapeHtml(act.exam.mapel)} (${escapeHtml(act.exam.kelas)})</div>
                    </div>
                    <span style="font-weight:800;color:var(--accent-primary);">${act.student.score}</span>
                  </button>
                `).join('')}
              </div>
            `}
          </div>

          <div class="bento-card bento-pastel-green">
            <div style="font-weight:800;font-size:16px;margin-bottom:6px;">Cadangan &amp; Pemulihan Data</div>
            <p style="font-size:13px;color:var(--text-muted);margin-bottom:14px;">
              Simpan seluruh data ujian, kunci jawaban, dan nilai siswa ke berkas JSON agar aman saat ganti perangkat.
            </p>
            <div class="btn-row">
              <button id="btnBackupJson" class="btn btn-hero btn-sm">Ekspor Cadangan (JSON)</button>
              <button id="btnRestoreJson" class="btn btn-soft btn-sm">Pulihkan Cadangan</button>
            </div>
          </div>
        </div>
      `;

      document.getElementById('inpSearchHistory')?.addEventListener('input', (e) => {
        uiState.historyQuery = e.target.value;
        renderApp();
      });

      container.querySelectorAll('[data-open-exam]').forEach(btn => {
        btn.addEventListener('click', () => {
          appState.activeExamId = btn.getAttribute('data-open-exam');
          saveState();
          navigateTo('hasil');
        });
      });

      container.querySelectorAll('[data-scan-exam]').forEach(btn => {
        btn.addEventListener('click', () => {
          appState.activeExamId = btn.getAttribute('data-scan-exam');
          saveState();
          navigateTo('pindai');
        });
      });

      container.querySelectorAll('[data-clone-exam]').forEach(btn => {
        btn.addEventListener('click', () => {
          const orig = appState.exams.find(x => x.id === btn.getAttribute('data-clone-exam'));
          if (!orig) return;
          const copy = {
            ...orig,
            id: uid(),
            kelas: orig.kelas + ' (Salinan)',
            key: [...orig.key],
            students: [],
            updatedAt: Date.now()
          };
          appState.exams.unshift(copy);
          appState.activeExamId = copy.id;
          saveState();
          showToast('Ujian disalin tanpa nilai lama');
          renderApp();
        });
      });

      container.querySelectorAll('[data-del-exam]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-del-exam');
          if (!confirm('Hapus ujian ini beserta seluruh nilai siswanya?')) return;
          appState.exams = appState.exams.filter(x => x.id !== id);
          if (appState.activeExamId === id) {
            appState.activeExamId = appState.exams[0]?.id || null;
          }
          saveState();
          showToast('Ujian dihapus');
          renderApp();
        });
      });

      container.querySelectorAll('[data-act-exam]').forEach(btn => {
        btn.addEventListener('click', () => {
          appState.activeExamId = btn.getAttribute('data-act-exam');
          saveState();
          navigateTo('hasil');
        });
      });

      document.getElementById('btnBackupJson')?.addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(appState, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Cadangan_KoreksiLJK_${todayLocalISO()}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('Berkas cadangan diunduh');
      });

      document.getElementById('btnRestoreJson')?.addEventListener('click', () => {
        document.getElementById('restoreJsonInput').click();
      });
    }

    /* ========================================================================
       H. FILE INPUT HANDLERS & SERVICE WORKER AUTO-UPDATE
       ======================================================================== */
    function handleImageFile(file, isKeyScan) {
      if (!file) return;
      const exam = uiState.draftExam || getActiveExam();
      if (!exam) {
        showToast('Buat ujian terlebih dahulu');
        return;
      }

      const img = new Image();
      img.onload = () => {
        const scan = processImageSource(img, exam.jumlahSoal);
        URL.revokeObjectURL(img.src);

        if (scan.results.length === 0) {
          showToast('Kotak sudut LJK tidak terdeteksi, coba foto lebih jelas');
          return;
        }

        if (isKeyScan) {
          const firstSheet = scan.results[0];
          for (let i = 0; i < exam.jumlahSoal; i++) {
            if (firstSheet.answers[i] && firstSheet.answers[i].length === 1) {
              exam.key[i] = firstSheet.answers[i];
            }
          }
          if (!uiState.draftExam) saveState();
          showToast('Kunci jawaban berhasil dipindai dari foto');
          renderApp();
        } else {
          addScannedResultsToBatch(scan.results);
        }
      };
      img.src = URL.createObjectURL(file);
    }

    function initGlobalEvents() {
      document.querySelectorAll('.nav-item').forEach(btn => {
        btn.addEventListener('click', () => navigateTo(btn.getAttribute('data-nav')));
      });

      document.getElementById('galleryInput').addEventListener('change', (e) => {
        handleImageFile(e.target.files[0], false);
        e.target.value = '';
      });

      document.getElementById('keyPhotoInput').addEventListener('change', (e) => {
        handleImageFile(e.target.files[0], true);
        e.target.value = '';
      });

      document.getElementById('restoreJsonInput').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(reader.result);
            if (parsed && Array.isArray(parsed.exams)) {
              appState = parsed;
              saveState();
              showToast('Data cadangan berhasil dipulihkan');
              renderApp();
            } else {
              showToast('Format berkas cadangan tidak valid');
            }
          } catch {
            showToast('Gagal membaca berkas JSON');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      });
    }

    function registerPWA() {
      if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        navigator.serviceWorker.register('./sw.js').then(reg => {
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            if (!newWorker) return;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'activated' && navigator.serviceWorker.controller) {
                window.location.reload();
              }
            });
          });
        }).catch(() => {});
      }
    }

    // BOOTSTRAP
    loadState();
    initThemeAndSplash();
    initGlobalEvents();
    registerPWA();
    renderApp();
  </script>
</body>
</html>
